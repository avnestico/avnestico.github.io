/* --- MOBILE FIRST (stacked) --- */

  display: flex;
  flex-direction: column;
}

/* Mobile order: title → inputs → chart */

.item-inputs { order: 2; }
.item-chart { order: 3; }

.inputs {
  width: 100%;
  padding: 20px;

}

.inputs label {
  display: block;
  margin-bottom: 12px;
  font-size: 18px;
}

.inputs input {
  width: 100%;
  padding: 10px;
  font-size: 18px;
  box-sizing: border-box;
}

.inputs input[type="range"] {
  padding: 0;
}

#yhat_value {
  margin-top: 20px;
  font-size: 24px;
  font-weight: bold;
}

#yhat_value_label {
  font-size: 24px;
  display: block;
  text-align: center;
}

.chart-wrapper {
  width: 100%;
}

.chart {
  display: flex;
  justify-content: center;
  user-select: none;
}

.chart > svg {
  width: 100%;
}

#plot {
  width: 100%;
  touch-action: none;
}

#chart_title {
  font-size: 24px;
  font-weight: bold;
  text-align: center;
  margin-top: 10px;
  margin-bottom: 10px;
}

/* --- DESKTOP GRID LAYOUT --- */
@media (min-width: 950px) {

  .container {
    display: grid;
    grid-template-columns: 300px 1fr;
    grid-template-areas:
      "inputs title"
      "inputs chart";
    gap: 20px;
    max-width: 1280px;
    margin: auto;
    padding: 10px;
  }

  .item-inputs {
    grid-area: inputs;
    width: 300px;
    padding: 10px;
  }

  .item-title {
    grid-area: title;
    font-size: 18px;
  }

  .item-chart {
    grid-area: chart;
  }

  .chart {
    justify-content: center;
  }

  .inputs input {
    width: 90%;
    padding: 6px;
    font-size: 16px;
  }

  #yhat_value, #yhat_value_label {
    font-size: 20px;
    text-align: left;
  }
}
</style>

<body>

<div class="container">

  <div id="chart_title" class="item-title">
    X-1-2 Cut Probability Simulation
  </div>

  <div class="inputs item-inputs">
    <label>Rounds:
      <span id="rounds_display">12</span>
      <input id="rounds" type="range" min="9" max="14" step="1" value="12">
    </label>

    <label>Entrants:
      <input id="entrants" type="number" min="65" max="4096" step="1" value="800">

    </label>

    <label>Tie Rate:
      <span id="tie_rate_display">15</span>%
      <input id="tie_rate" type="range" min="10" max="15" step="1" value="15">
    </label>

    <label>Day 1 X-2-0 Tie Rate:
      <span id="day1_tie_rate_display">75</span>%
      <input id="day1_tie_rate" type="range" min="60" max="90" step="1" value="75">
    </label>

    <span id="yhat_value_label">

  </div>

  <div class="chart-wrapper item-chart">
    <div class="chart">

<script>
function parseCSV(text) {
  const lines = text.trim().split("\n");
  const headers = lines[0].split(",");
  return lines.slice(1).map(line => {
    const cols = line.split(",");
    const obj = {};
    headers.forEach((h, i) => {
      const v = cols[i];
      obj[h] = isNaN(v) ? v : Number(v);
    });
    return obj;
  });
}

const summary_delta = parseCSV(summary_delta_csv);
const summary_shift = parseCSV(summary_shift_csv);
const summary_k     = parseCSV(summary_k_csv);

function lookup(table, filters, returnCol) {
  const row = table.find(row =>
    Object.entries(filters).every(([col, val]) => row[col] == val)
  );
  if (!row) return undefined;
  return row[returnCol];
}

const BASE_DAY1_TIE_RATE = 0.75;

function get_base_delta(ceilLogEntrants, tieRateFloat) {
  return lookup(summary_delta,
    { CeilingLogEntrants: ceilLogEntrants, TieRate: tieRateFloat },
    "Delta"
  );
}

function get_delta_shift(ceilLogEntrants, day1TieRatePercent) {
  const baseShift = lookup(summary_shift,
    { CeilingLogEntrants: ceilLogEntrants },
    "DeltaShift"
  );
  return (day1TieRatePercent/100 - BASE_DAY1_TIE_RATE) * baseShift;
}

function get_delta(ceilLogEntrants, tieRateFloat, day1TieRatePercent) {
  const base = get_base_delta(ceilLogEntrants, tieRateFloat);
  const shift = get_delta_shift(ceilLogEntrants, day1TieRatePercent);
  return base + shift;
}

function get_k(ceilLogEntrants) {
  return lookup(summary_k,
    { CeilingLogEntrants: ceilLogEntrants },
    "K"
  );
}

function yhat(x, k, delta) {
  return 1 / (1 + Math.exp(-k * (x - delta)));
}

function computeCurve(entrants, tieRatePercent, day1TieRatePercent) {
  const tieRateFloat = tieRatePercent / 100;
  const logEntrants = Math.log2(entrants);
  const ceilLog = Math.ceil(logEntrants);
  const delta = get_delta(ceilLog, tieRateFloat, day1TieRatePercent);
  const k = get_k(ceilLog);

  const minEnt = Math.pow(2, ceilLog - 1) + 1;
  const maxEnt = Math.pow(2, ceilLog);

  const xs = [];
  const ys = [];

  for (let ent = minEnt; ent <= maxEnt; ent++) {
    const x = Math.log2(ent) - ceilLog + 1;
    xs.push(ent);
    ys.push(yhat(x, k, delta));
  }

  const mantissa = logEntrants - ceilLog + 1;
  const actualY = yhat(mantissa, k, delta);

  return { xs, ys, actualX: entrants, actualY };
}

function entrantsToRounds(ent) {
  return Math.ceil(Math.log2(ent)) + 2;
}

function roundsToEntrants(rounds, mantissa) {
  const ceilLog = rounds - 2;
  return Math.round(Math.pow(2, ceilLog - 1 + mantissa));
}

function getMantissa(ent) {
  const logEnt  = Math.log2(ent);
  const ceilLog = Math.ceil(logEnt);
  return logEnt - ceilLog + 1;
}

function getEntrantBoundsForRounds(rounds) {
  const ceilLog = rounds - 2;
  const min = Math.pow(2, ceilLog - 1) + 1;
  const max = Math.pow(2, ceilLog);
  return { min, max };
}

function commit(fn, el) {
  fn();
  el.blur();
  if (window.render) window.render();
}

function onCommit(id, fn) {
  const el = document.getElementById(id);

  el.addEventListener("keydown", e => {
    if (e.key === "Enter") {
      fn();
      el.blur();
      if (window.render) window.render();
    }
  });

  el.addEventListener("blur", () => {
    fn();
    if (window.render) window.render();
  });
}

function updateSliderBounds(rounds) {
  const slider = document.getElementById("entrants_slider");
  const { min, max } = getEntrantBoundsForRounds(rounds);
  slider.min = min;
  slider.max = max;
}

function syncFromEntrantsText() {
  const entInput   = document.getElementById("entrants");
  const roundsDisp  = document.getElementById("rounds_display");
  const roundsSlider = document.getElementById("rounds");
  const slider     = document.getElementById("entrants_slider");

  let ent = +entInput.value;

  if (ent < 65) ent = 65;
  if (ent > 4096) ent = 4096;

  entInput.value = ent;

  const rounds = entrantsToRounds(ent);

  roundsDisp.textContent = rounds;
  roundsSlider.value = rounds;

  updateSliderBounds(rounds);

  const { min, max } = getEntrantBoundsForRounds(rounds);
  const entClamped = Math.max(min, Math.min(max, ent));

  entInput.value = entClamped;
  slider.value   = entClamped;
}

function syncFromRoundsMantissa() {
  const entInput   = document.getElementById("entrants");
  const roundsDisp = document.getElementById("rounds_display");
  const slider     = document.getElementById("entrants_slider");

  const rounds = +roundsDisp.textContent;
  const ent    = +entInput.value;

  const mantissa = getMantissa(ent);
  const newEnt   = roundsToEntrants(rounds, mantissa);

  updateSliderBounds(rounds);

  const { min, max } = getEntrantBoundsForRounds(rounds);
  const entClamped = Math.max(min, Math.min(max, newEnt));

  entInput.value = entClamped;
  slider.value   = entClamped;
}

window.updateFromEntrants = function() {
  syncFromEntrantsText();
  if (window.render) window.render();
};

function linkEntrantsSlider() {
  const entInput   = document.getElementById("entrants");
  const slider     = document.getElementById("entrants_slider");

  slider.addEventListener("input", () => {
    const ent = +slider.value;
    entInput.value = ent;
    if (window.render) window.render();
  });

  onCommit("entrants", () => {
    syncFromEntrantsText();
  });
}

document.getElementById("rounds").addEventListener("input", () => {
  const rounds = +document.getElementById("rounds").value;
  document.getElementById("rounds_display").textContent = rounds;
  syncFromRoundsMantissa();
  if (window.render) window.render();
});

document.getElementById("tie_rate").addEventListener("input", () => {
  const v = +document.getElementById("tie_rate").value;
  document.getElementById("tie_rate_display").textContent = v;
  if (window.render) window.render();
});

document.getElementById("day1_tie_rate").addEventListener("input", () => {
  const v = +document.getElementById("day1_tie_rate").value;
  document.getElementById("day1_tie_rate_display").textContent = v;
  if (window.render) window.render();
});

(function initCoupling() {
  const entInput   = document.getElementById("entrants");
  const roundsDisp = document.getElementById("rounds_display");
  const roundsSlider = document.getElementById("rounds");
  const slider     = document.getElementById("entrants_slider");

  const initialEnt    = +entInput.value;
  const initialRounds = entrantsToRounds(initialEnt);

  roundsDisp.textContent = initialRounds;
  roundsSlider.value = initialRounds;

  updateSliderBounds(initialRounds);

  const { min, max } = getEntrantBoundsForRounds(initialRounds);
  const entClamped = Math.max(min, Math.min(max, initialEnt));

  entInput.value = entClamped;
  slider.value   = entClamped;

  linkEntrantsSlider();

  if (window.render) window.render();
})();
</script>
